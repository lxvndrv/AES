<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AES SYSTEM: INITIALIZING...</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300..700&display=swap" rel="stylesheet">

    <style>
        /* AES Black and Gold Theme Colors */
        :root {
            --bg-color: #0b0d0f;
            --container-bg: #13171a;
            --gold: #dfb24c;
            --gold-glow: rgba(223, 178, 76, 0.4);
            --text-color: #e2e8f0;
            --border-color: #2a323d;
            --white-glow: rgba(255, 255, 255, 0.6);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Fredoka', sans-serif; /* Applied everywhere */
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            overflow: hidden;
        }

        /* --- ADVANCED CINEMATIC INTRO SCREEN --- */
        #intro-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #050607;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 999;
            opacity: 1;
            visibility: visible;
            transition: opacity 1.2s ease-in-out, visibility 1.2s;
        }

        /* Container isolating the custom logo graphic */
        .logo-box {
            position: relative;
            width: 180px;
            height: 180px;
            margin-bottom: 30px;
            opacity: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            animation: fadeInLogo 2s cubic-bezier(0.4, 0, 0.2, 1) forwards;
            animation-delay: 0.8s;
        }

        /* Pure CSS drawing your exact custom pixel logo layout with a glowing white background aura */
        .custom-pixel-backpack {
            width: 100px;
            height: 120px;
            background-color: #121518;
            border: 5px solid #1a1e22;
            border-radius: 20px 20px 30px 30px;
            position: relative;
            /* Creates the perfect white glow look behind the logo without a messy square box */
            filter: drop-shadow(0 0 25px var(--white-glow)); 
        }

        /* The Graduation Cap on top of the backpack */
        .custom-pixel-backpack::before {
            content: '';
            position: absolute;
            top: -22px;
            left: -15px;
            width: 120px;
            height: 30px;
            background-color: #0c0e10;
            border: 4px solid var(--gold);
            transform: rotate(-12deg);
            border-radius: 4px;
        }

        /* The AES Yellow text inside the bag */
        .custom-pixel-backpack::after {
            content: 'AES';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -30%);
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--gold);
            letter-spacing: 2px;
        }

        .boot-text {
            color: #64748b;
            font-size: 1rem;
            letter-spacing: 1.5px;
            font-weight: 500;
            height: 25px;
            text-align: center;
            opacity: 0;
            animation: fadeInText 1s ease forwards;
            animation-delay: 0.2s;
        }

        /* Fade Animations */
        @keyframes fadeInLogo {
            0% { opacity: 0; transform: scale(0.9); }
            100% { opacity: 1; transform: scale(1); }
        }

        @keyframes fadeInText {
            0% { opacity: 0; }
            100% { opacity: 1; }
        }

        /* --- MAIN QUESTION INTERFACE DECRYPTION PANEL --- */
        .terminal {
            background-color: var(--container-bg);
            border: 2px solid var(--border-color);
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.8);
            border-radius: 16px;
            width: 100%;
            max-width: 500px;
            padding: 35px 25px;
            text-align: center;
            opacity: 0;
            transform: scale(0.96);
            transition: opacity 1.5s cubic-bezier(0.34, 1.56, 0.64, 1), transform 1.5s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        /* Smooth reveal trigger */
        .terminal.visible {
            opacity: 1;
            transform: scale(1);
        }

        .terminal.unlocked {
            border-color: var(--gold);
            box-shadow: 0 0 40px var(--gold-glow);
        }

        h1 {
            color: var(--gold);
            font-size: 2.1rem;
            font-weight: 700;
            letter-spacing: 2px;
            margin-bottom: 6px;
            text-shadow: 0 0 15px var(--gold-glow);
        }

        .subtitle {
            font-size: 0.9rem;
            font-weight: 500;
            color: #64748b;
            margin-bottom: 35px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Decryption Box Items */
        .date-display {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            margin-bottom: 40px;
        }

        .box {
            width: 48px;
            height: 58px;
            border: 2px solid var(--border-color);
            background-color: #07090a;
            font-size: 1.8rem;
            font-weight: 700;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 8px;
            color: #475569;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .box.revealed {
            color: var(--gold);
            border-color: var(--gold);
            text-shadow: 0 0 10px var(--gold-glow);
            transform: translateY(-4px);
        }

        .separator {
            font-size: 2.2rem;
            color: #475569;
            font-weight: 700;
        }

        /* Puzzle Settings Layout */
        .puzzle-section {
            border-top: 1px solid var(--border-color);
            padding-top: 25px;
            text-align: left;
        }

        .riddle-card {
            margin-bottom: 25px;
            padding: 18px;
            background-color: #181d22;
            border-left: 5px solid #475569;
            border-radius: 0 12px 12px 0;
            transition: all 0.4s ease;
        }

        .riddle-card.solved {
            border-left-color: var(--gold);
            background-color: #141b18;
        }

        .riddle-title {
            font-size: 0.95rem;
            font-weight: 700;
            color: var(--gold);
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .riddle-text {
            font-size: 0.95rem;
            line-height: 1.5;
            margin-bottom: 15px;
            color: #cbd5e1;
            font-weight: 400;
        }

        .input-group {
            display: flex;
            gap: 12px;
        }

        input[type="text"] {
            flex: 1;
            background-color: #07090a;
            border: 2px solid var(--border-color);
            padding: 10px 14px;
            color: #fff;
            font-size: 1rem;
            border-radius: 8px;
            outline: none;
            font-weight: 500;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus {
            border-color: var(--gold);
        }

        button {
            background-color: #222930;
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 10px 20px;
            cursor: pointer;
            font-size: 0.95rem;
            font-weight: 700;
            border-radius: 8px;
            letter-spacing: 1px;
            transition: all 0.2s ease;
        }

        button:hover {
            background-color: var(--gold);
            color: #000;
            transform: translateY(-2px);
        }

        .solved-msg {
            color: #10b9
